<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06152e"><title>DEME Marine English Learning</title><style>*{box-sizing:border-box}body{margin:0;background:#05142d;color:#f6f9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#06152eee;border-bottom:1px solid #1c4775;padding:14px}.wrap{max-width:950px;margin:auto}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#91acd0;margin-top:4px}main{padding:14px 14px 80px}.hero{background:linear-gradient(135deg,#10305e,#081b39);border:1px solid #235487;border-radius:20px;padding:17px;margin-bottom:14px}.hero h2{margin:0 0 8px;font-size:23px}.hero p{margin:0;color:#c9d8ec;line-height:1.65;font-size:14px}.test{margin-top:12px;padding:11px 13px;border:1px solid #18c9ff;border-radius:12px;background:#0a2b51;color:#a9efff;font-weight:700}input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #285886;background:#081d3c;color:#fff;font-size:16px;margin:13px 0}.pills{display:flex;gap:7px;overflow:auto;padding-bottom:9px}.pill{white-space:nowrap;border:1px solid #24527f;background:#092142;color:#bdd0e8;border-radius:999px;padding:8px 10px}.pill.on{border-color:#17c8ff;background:#0c4167;color:#fff}h3{font-size:17px;margin:23px 2px 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,#0d2850,#081d3b);border:1px solid #1e4b79;border-radius:16px;padding:14px}.term{font-size:22px;font-weight:800}.ipa{font-family:Georgia,serif;color:#83dcff;margin-top:3px}.cn{margin-top:5px;font-size:14px}.scene,.ex{font-size:12px;line-height:1.55;color:#abc1dd;margin-top:9px}.ex{border-top:1px dashed #26517f;padding-top:8px;color:#d9e5f4}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}button{cursor:pointer}.audio{border:1px solid #2c6599;background:#09264d;color:#fff;border-radius:10px;padding:8px 10px;font-weight:650}.audio.word{border-color:#19c9ff;color:#a8efff}.audio.slow{border-color:#ffc32b;color:#ffe3a0}.note{font-size:11px;color:#8fa8c8;line-height:1.5;margin:20px 2px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h2{font-size:21px}}</style></head><body><header><div class="wrap"><h1>DEME Marine English Learning</h1><div class="sub">海事工程 · Offshore · 港口 · 船舶 · Heavy Lifting · Video AI</div></div></header><main class="wrap"><section class="hero"><h2>DEME 客户专业英语随身学习</h2><p>111 个核心术语，包含发音、IPA、中文解释、DEME 场景理解和业务例句。点击按钮直接听英式发音。</p><button class="test" id="test">🔊 先测试声音：Offshore</button></section><input id="q" placeholder="搜索英文 / 中文，例如 berth、吊装、AIS"><div id="pills" class="pills"></div><div id="content"></div><div class="note">声音由 Safari / Chrome / Edge 的系统英文语音直接播放。首次使用请直接点击发音按钮。</div></main><script src="01-basics.js"></script><script src="02-port.js"></script><script src="03-vessel.js"></script><script src="04-hse.js"></script><script src="05-visual.js"></script><script src="06-engineering.js"></script><script src="07-digital.js"></script><script>
const T=window.DEME_TERMS||[],C=[...new Set(T.map(x=>x.cat))];let cat='全部';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang==='en-GB')||vs.find(v=>v.lang&&v.lang.startsWith('en'))||null}
function say(text,rate=.88){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音朗读，请使用 Safari、Chrome 或 Edge。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;u.pitch=1;const v=getVoice();if(v)u.voice=v;speechSynthesis.speak(u)}
function drawPills(){pills.innerHTML=['全部',...C].map(x=>`<button class="pill ${x===cat?'on':''}" data-c="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;drawPills();render()})}
function render(){const s=q.value.trim().toLowerCase();const a=T.filter(t=>(cat==='全部'||t.cat===cat)&&(!s||[t.term,t.cn,t.scene,t.ex,t.cat].join(' ').toLowerCase().includes(s)));const g={};a.forEach(t=>(g[t.cat]??=[]).push(t));content.innerHTML=Object.entries(g).map(([k,v])=>`<section><h3>${esc(k)} · ${v.length}</h3><div class="grid">${v.map(t=>`<article class="card"><div class="term">${esc(t.term)}</div><div class="ipa">${esc(t.ipa)}</div><div class="cn">${esc(t.cn)}</div><div class="scene"><b style="color:#67d8ff">DEME 场景：</b>${esc(t.scene)}</div><div class="ex"><b style="color:#ffd363">例句：</b>${esc(t.ex)}</div><div class="buttons"><button class="audio word" data-word="${esc(t.term)}">🔊 单词发音</button><button class="audio slow" data-slow="${esc(t.term)}">🐢 慢速</button><button class="audio" data-ex="${esc(t.term)}">🔊 听例句</button></div></article>`).join('')}</div></section>`).join('');document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const t=T.find(x=>x.term===b.dataset.word);say(t.say||t.term,.88)});document.querySelectorAll('[data-slow]').forEach(b=>b.onclick=()=>{const t=T.find(x=>x.term===b.dataset.slow);say(t.say||t.term,.62)});document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const t=T.find(x=>x.term===b.dataset.ex);say(t.ex,.85)})}
q.oninput=render;test.onclick=()=>say('offshore',.82);if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};drawPills();render();
</script></body></html>
