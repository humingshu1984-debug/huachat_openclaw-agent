<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DEME Marine English Learning</title>
<style>
:root{--bg:#051225;--panel:#0a2344;--panel2:#0d2d56;--line:#234d76;--text:#f8fbff;--muted:#97acc7;--cyan:#1bc9ff;--blue:#4b82ff;--yellow:#ffc447;--green:#20d7a0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,#16447455,transparent 30%),linear-gradient(180deg,#07162d,#031020 72%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:#06152eea;backdrop-filter:blur(14px);border-bottom:1px solid #18395e;padding:max(10px,env(safe-area-inset-top)) 14px 10px}.top{max-width:1050px;margin:auto;display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;color:#001526;font-weight:900}.title{font-weight:800;font-size:18px}.sub{color:var(--muted);font-size:11px;margin-top:2px}
main{max-width:1050px;margin:auto;padding:14px 12px 94px}.hero{background:linear-gradient(135deg,#10315f,#081a35);border:1px solid #235384;border-radius:20px;padding:18px;box-shadow:0 18px 55px #0004}.hero h1{font-size:25px;margin:0 0 8px}.hero p{margin:0;color:#c6d6ea;line-height:1.65;font-size:14px}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.cta{border:1px solid #2b6599;background:#0a274b;color:white;padding:10px 12px;border-radius:12px;font-weight:700}.cta.primary{border-color:var(--cyan);color:#a9efff}.cta.yellow{border-color:var(--yellow);color:#ffe1a0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#061a36;border:1px solid #1f4770;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;color:var(--cyan);font-size:20px}.stat span{font-size:10px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.quick button{background:#0a2141;border:1px solid #214e7c;color:#e7f0fb;border-radius:14px;padding:12px 10px;text-align:left}.quick b{display:block;font-size:13px}.quick small{color:#8fa8c7;font-size:10px;line-height:1.4}
.searchbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:13px 0}.search{width:100%;background:#071c39;color:#fff;border:1px solid #275482;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}.filterBtn{background:#0b2b53;border:1px solid #316296;color:white;border-radius:13px;padding:0 13px;font-weight:700}
.pills{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.pill{white-space:nowrap;background:#071d3a;border:1px solid #214c78;color:#b9cde6;border-radius:999px;padding:8px 10px;font-size:12px}.pill.on{border-color:var(--cyan);background:#0c416a;color:white}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:23px 2px 10px}.sectionHead h2{font-size:17px;margin:0}.sectionHead span{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,#0c294e,#071b38);border:1px solid #1f4d79;border-radius:17px;padding:14px;position:relative}.card.mastered{border-color:#278d73;background:linear-gradient(180deg,#0d3a43,#071b34)}.term{font-size:21px;font-weight:850}.ipa{color:#8ddfff;font-family:Georgia,serif;font-size:13px;margin-top:3px}.cn{font-size:14px;margin-top:5px}.scene,.ex{font-size:12px;line-height:1.55;color:#abc0dc;margin-top:9px}.ex{border-top:1px dashed #2a547f;padding-top:8px;color:#dce6f3}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.audio,.smallBtn{border:1px solid #2d6193;background:#092649;color:white;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:700}.audio.word{border-color:#17c8ff;color:#a7efff}.audio.slow{border-color:#ffc447;color:#ffe0a2}.done{display:flex;align-items:center;gap:5px;color:#97aec9;font-size:10px;position:absolute;right:12px;top:12px}.done input{width:17px;height:17px;accent-color:var(--green)}
.studyDock{position:fixed;left:0;right:0;bottom:0;background:#06152ef2;border-top:1px solid #244d76;backdrop-filter:blur(14px);padding:8px 12px max(8px,env(safe-area-inset-bottom));z-index:30}.dock{max-width:1050px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.dock button{background:#0b2950;border:1px solid #2b5d8d;color:white;border-radius:12px;padding:10px 6px;font-weight:750}.dock .quiz{border-color:var(--yellow);color:#ffe09a}
.overlay{position:fixed;inset:0;background:#001027f2;z-index:50;display:none;padding:18px;overflow:auto}.overlay.show{display:block}.modal{max-width:560px;margin:6vh auto 0}.close{float:right;width:38px;height:38px;border-radius:50%;border:1px solid #42678e;background:transparent;color:white;font-size:20px}.flash{margin-top:50px;background:#0b2448;border:1px solid #2a5888;border-radius:22px;padding:20px}.flash .tag{font-size:11px;color:#6bdcff;font-weight:800}.flash .big{font-size:33px;font-weight:900;margin-top:16px}.meaning{font-size:19px;color:#d7e4f4;margin-top:18px}.blur{filter:blur(7px);user-select:none}.modalBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.modalBtns button{padding:10px 12px;border-radius:11px;background:#0b2a50;color:white;border:1px solid #2d6193}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#0b2b4f;color:#dff3ff;border:1px solid #2b658f;border-radius:12px;padding:9px 12px;font-size:12px;display:none;z-index:60}.toast.show{display:block}
.note{color:#7f9bbc;font-size:10px;line-height:1.5;margin:18px 3px}.hidden{display:none!important}
@media(max-width:720px){.grid{grid-template-columns:1fr}.hero h1{font-size:22px}.quick{grid-template-columns:1fr 1fr}.quick button:last-child{grid-column:1/-1}.term{font-size:20px}}
</style>
</head>
<body>
<header><div class="top"><div class="logo">D</div><div><div class="title">DEME Marine English Learning</div><div class="sub">海事工程 · Offshore · Vessel · HSE · Visual AI</div></div></div></header>
<main>
<section class="hero">
<h1>DEME 客户专业英语随身学</h1>
<p>围绕 DEME 真实业务语境整理的 111 个核心术语。直接打开就是学习页，不再经过任何跳转页面。</p>
<div class="hero-actions"><button class="cta primary" id="testSound">🔊 测试发音：Offshore</button><button class="cta yellow" id="top30Btn">⭐ PPT 高频 Top 30</button></div>
<div class="stats"><div class="stat"><b id="totalN">111</b><span>核心术语</span></div><div class="stat"><b id="doneN">0</b><span>已掌握</span></div><div class="stat"><b id="pctN">0%</b><span>学习进度</span></div></div>
</section>
<div class="quick"><button id="dailyBtn"><b>📅 今日 10 词</b><small>随机抽取 10 个未掌握词</small></button><button id="unmasteredBtn"><b>📚 只看未掌握</b><small>快速集中复习薄弱项</small></button><button id="randomBtn"><b>🎧 随机听一个</b><small>听发音后再看释义</small></button></div>
<div class="searchbar"><input id="q" class="search" placeholder="搜索英文 / 中文，例如 berth、吊装、AIS"><button id="resetBtn" class="filterBtn">重置</button></div>
<div id="pills" class="pills"></div>
<div id="content"></div>
<div class="note">发音调用手机/电脑系统英文语音（优先 en-GB）。建议在 Safari、Chrome 或 Edge 中使用。学习进度只保存在当前浏览器。</div>
</main>
<div class="studyDock"><div class="dock"><button id="listenBtn">🔊 听词</button><button id="reviewBtn">🔁 复习</button><button class="quiz" id="quizBtn">🎯 闪卡</button></div></div>
<div class="overlay" id="overlay"><button class="close" id="closeBtn">×</button><div class="modal"><div class="flash"><div class="tag">DEME MARINE FLASHCARD</div><div class="big" id="fTerm"></div><div class="ipa" id="fIpa"></div><button class="cta primary" id="fSpeak" style="margin-top:12px">🔊 听发音</button><div class="meaning blur" id="fCn"></div><div class="scene blur" id="fScene"></div><div class="modalBtns"><button id="revealBtn">显示答案</button><button id="knowBtn">✅ 我会了</button><button id="nextBtn">下一词 →</button></div></div></div></div>
<div class="toast" id="toast"></div>
<script src="01-basics.js"></script><script src="02-port.js"></script><script src="03-vessel.js"></script><script src="04-hse.js"></script><script src="05-visual.js"></script><script src="06-engineering.js"></script><script src="07-digital.js"></script>
<script>
const T=window.DEME_TERMS||[];const C=[...new Set(T.map(x=>x.cat))];
const TOP30=['offshore','vessel','work vessel','marine infrastructure','dredging','concession','port','terminal','berth','anchorage','fairway','waterside','onboard','deck','bridge','heavy lifting','exclusion zone','dynamic exclusion zone','blind spot','PPE','HSE','hazard','near miss','situational awareness','AIS','radar','PTZ camera','multi-source data fusion','harsh marine environment','digital twin'];
let active='全部',onlyUnmastered=false,mode='all',flash=null;
const state=JSON.parse(localStorage.getItem('demeMarineStateV4')||'{}');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('demeMarineStateV4',JSON.stringify(state));stats()}
function stats(){const n=Object.values(state).filter(Boolean).length;$('totalN').textContent=T.length;$('doneN').textContent=n;$('pctN').textContent=Math.round(n/T.length*100)+'%'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function voice(){const v=speechSynthesis.getVoices();return v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang&&x.lang.startsWith('en'))||null}
function say(text,rate=.86){if(!('speechSynthesis'in window)){alert('当前浏览器不支持网页语音。请用 Safari、Chrome 或 Edge。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;u.pitch=1;const v=voice();if(v)u.voice=v;speechSynthesis.speak(u)}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
function pills(){ $('pills').innerHTML=['全部',...C].map(x=>`<button class="pill ${x===active?'on':''}" data-cat="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;mode='all';pills();render()}) }
function pool(){let a=T.slice();if(mode==='top30')a=a.filter(t=>TOP30.includes(t.term));if(mode==='daily'){const key='demeDaily_'+new Date().toISOString().slice(0,10);let names=JSON.parse(localStorage.getItem(key)||'null');if(!names){const u=T.filter(t=>!state[t.term]).sort(()=>Math.random()-.5).slice(0,10);names=u.map(x=>x.term);localStorage.setItem(key,JSON.stringify(names))}a=a.filter(t=>names.includes(t.term))}if(active!=='全部')a=a.filter(t=>t.cat===active);if(onlyUnmastered)a=a.filter(t=>!state[t.term]);const s=$('q').value.trim().toLowerCase();if(s)a=a.filter(t=>[t.term,t.cn,t.scene,t.ex,t.cat].join(' ').toLowerCase().includes(s));return a}
function render(){const a=pool(),g={};a.forEach(t=>(g[t.cat]??=[]).push(t));$('content').innerHTML=Object.entries(g).map(([k,v])=>`<section><div class="sectionHead"><h2>${esc(k)}</h2><span>${v.length} 个术语</span></div><div class="grid">${v.map(t=>`<article class="card ${state[t.term]?'mastered':''}"><label class="done"><input type="checkbox" data-done="${esc(t.term)}" ${state[t.term]?'checked':''}> 已掌握</label><div class="term">${esc(t.term)}</div><div class="ipa">${esc(t.ipa)}</div><div class="cn">${esc(t.cn)}</div><div class="scene"><b style="color:#69d9ff">DEME 场景：</b>${esc(t.scene)}</div><div class="ex"><b style="color:#ffd267">例句：</b>${esc(t.ex)}</div><div class="actions"><button class="audio word" data-word="${esc(t.term)}">🔊 单词</button><button class="audio slow" data-slow="${esc(t.term)}">🐢 慢速</button><button class="audio" data-ex="${esc(t.term)}">🔊 例句</button></div></article>`).join('')}</div></section>`).join('')||'<div style="text-align:center;color:#8ea7c6;padding:50px 0">没有匹配的术语</div>';document.querySelectorAll('[data-done]').forEach(x=>x.onchange=()=>{state[x.dataset.done]=x.checked;save();render()});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const t=T.find(x=>x.term===b.dataset.word);say(t.say||t.term,.86)});document.querySelectorAll('[data-slow]').forEach(b=>b.onclick=()=>{const t=T.find(x=>x.term===b.dataset.slow);say(t.say||t.term,.62)});document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const t=T.find(x=>x.term===b.dataset.ex);say(t.ex,.84)})}
function pickFlash(){const p=T.filter(t=>!state[t.term]);flash=(p.length?p:T)[Math.floor(Math.random()*(p.length||T.length))];$('fTerm').textContent=flash.term;$('fIpa').textContent=flash.ipa;$('fCn').textContent=flash.cn;$('fScene').textContent='DEME 场景：'+flash.scene;$('fCn').classList.add('blur');$('fScene').classList.add('blur')}
$('q').oninput=render;$('resetBtn').onclick=()=>{$('q').value='';active='全部';mode='all';onlyUnmastered=false;$('unmasteredBtn').innerHTML='<b>📚 只看未掌握</b><small>快速集中复习薄弱项</small>';pills();render()};$('testSound').onclick=()=>say('offshore',.82);$('top30Btn').onclick=()=>{mode='top30';active='全部';pills();render();toast('已切换到 PPT 高频 Top 30')};$('dailyBtn').onclick=()=>{mode='daily';active='全部';pills();render();toast('已载入今日 10 词')};$('unmasteredBtn').onclick=()=>{onlyUnmastered=!onlyUnmastered;$('unmasteredBtn').innerHTML=onlyUnmastered?'<b>📚 显示全部</b><small>返回完整术语库</small>':'<b>📚 只看未掌握</b><small>快速集中复习薄弱项</small>';render()};$('randomBtn').onclick=()=>{const p=T.filter(t=>!state[t.term]);const t=(p.length?p:T)[Math.floor(Math.random()*(p.length||T.length))];say(t.say||t.term,.82);toast(t.term+' · '+t.cn)};$('listenBtn').onclick=$('randomBtn').onclick;$('reviewBtn').onclick=()=>{onlyUnmastered=true;mode='all';active='全部';pills();render();window.scrollTo({top:350,behavior:'smooth'})};$('quizBtn').onclick=()=>{$('overlay').classList.add('show');pickFlash()};$('closeBtn').onclick=()=>$('overlay').classList.remove('show');$('revealBtn').onclick=()=>{$('fCn').classList.remove('blur');$('fScene').classList.remove('blur')};$('fSpeak').onclick=()=>say(flash.say||flash.term,.82);$('knowBtn').onclick=()=>{state[flash.term]=true;save();pickFlash();render()};$('nextBtn').onclick=pickFlash;
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};pills();stats();render();
</script>
</body></html>
